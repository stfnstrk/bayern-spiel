<!DOCTYPE html>
<html lang="de">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<meta name="apple-mobile-web-app-capable" content="yes">
<title>Bayern-Blöcke</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link href="https://fonts.googleapis.com/css2?family=Press+Start+2P&family=Nunito:wght@600;800;900&display=swap" rel="stylesheet">
<style>
:root{--sky:#7ec8f5;--grass:#5cb53a;--grass-d:#3f8a25;--dirt:#8b5a2b;--dirt-d:#5e3b1a;--stone:#8e8e8e;--stone-d:#5f5f5f;
--blue:#1f6fd1;--blue-d:#134a92;--gold:#f4c430;--gold-d:#b88c0c;--red:#e04b3c;--red-d:#9c2a1f;--ink:#23272e;--paper:#fffdf6}
*{box-sizing:border-box;-webkit-tap-highlight-color:transparent}
html,body{margin:0;min-height:100%}
body{font-family:'Nunito',system-ui,sans-serif;font-weight:800;color:var(--ink);font-size:19px;
background:var(--sky);background-image:linear-gradient(var(--sky) 0 70%,#a9dcf8 100%);min-height:100vh;
padding:env(safe-area-inset-top) env(safe-area-inset-right) env(safe-area-inset-bottom) env(safe-area-inset-left)}
.px{font-family:'Press Start 2P',monospace;font-weight:400;letter-spacing:.5px}
#app{max-width:920px;margin:0 auto;padding:14px 14px 40px}
.top{display:flex;align-items:center;gap:10px;margin-bottom:12px}
.top h1{font-size:18px;margin:0;color:#fff;text-shadow:3px 3px 0 var(--blue-d);flex:1;line-height:1.5}
.pill{background:var(--paper);border:3px solid var(--ink);padding:6px 10px;display:flex;align-items:center;gap:6px;font-size:16px;box-shadow:3px 3px 0 rgba(0,0,0,.25)}
.raute{width:20px;height:20px;display:inline-block;background:
 conic-gradient(from 45deg,#fff 0 25%,var(--blue) 0 50%,#fff 0 75%,var(--blue) 0);background-size:10px 10px;border:2px solid var(--ink);transform:rotate(45deg) scale(.8)}
.card{background:var(--paper);border:4px solid var(--ink);box-shadow:6px 6px 0 rgba(0,0,0,.28);padding:16px;margin-bottom:16px;position:relative}
.ground{height:22px;background:linear-gradient(var(--grass) 0 40%,var(--dirt) 40%);border-top:4px solid var(--grass-d);margin:0 -16px -16px;border-bottom:0}
.btn{font:inherit;font-weight:900;font-size:19px;border:4px solid var(--ink);background:var(--stone);color:#fff;padding:14px 18px;cursor:pointer;
 box-shadow:inset -4px -6px 0 var(--stone-d),inset 4px 4px 0 rgba(255,255,255,.35);text-shadow:2px 2px 0 rgba(0,0,0,.4);min-height:58px;touch-action:manipulation}
.btn:active{transform:translateY(3px);box-shadow:inset -4px -3px 0 var(--stone-d)}
.btn.green{background:var(--grass);box-shadow:inset -4px -6px 0 var(--grass-d),inset 4px 4px 0 rgba(255,255,255,.35)}
.btn.blue{background:var(--blue);box-shadow:inset -4px -6px 0 var(--blue-d),inset 4px 4px 0 rgba(255,255,255,.3)}
.btn.gold{background:var(--gold);color:var(--ink);text-shadow:none;box-shadow:inset -4px -6px 0 var(--gold-d),inset 4px 4px 0 rgba(255,255,255,.45)}
.btn.red{background:var(--red);box-shadow:inset -4px -6px 0 var(--red-d)}
.btn.wood{background:#b07a3e;box-shadow:inset -4px -6px 0 #7a4f22,inset 4px 4px 0 rgba(255,255,255,.3)}
.btn.small{font-size:15px;padding:8px 12px;min-height:44px}
.btn.ghost{background:var(--paper);color:var(--ink);text-shadow:none;box-shadow:inset -3px -4px 0 #d8d2c0}
.btn.sel{background:var(--gold);color:var(--ink);text-shadow:none;box-shadow:inset -4px -6px 0 var(--gold-d)}
.btn.ok{background:var(--grass)!important;color:#fff!important}
.btn.no{background:var(--red)!important;color:#fff!important}
.btn[disabled]{opacity:.55;cursor:default}
.grid{display:grid;grid-template-columns:repeat(auto-fill,minmax(250px,1fr));gap:14px}
.st{text-align:left;display:flex;gap:12px;align-items:center;background:var(--paper);color:var(--ink);text-shadow:none;box-shadow:inset -4px -6px 0 #d8d2c0;padding:12px}
.st .ic{font-size:34px;width:52px;height:52px;display:grid;place-items:center;background:#e9f4ff;border:3px solid var(--ink)}
.st .nm{font-size:18px;line-height:1.2}
.stars{font-size:18px;letter-spacing:2px;margin-top:4px}
.stars .off{filter:grayscale(1);opacity:.3}
.opts{display:grid;grid-template-columns:repeat(auto-fit,minmax(200px,1fr));gap:10px;margin-top:12px}
.q{font-size:24px;line-height:1.4;margin:6px 0 4px}
.gap{display:inline-block;min-width:110px;border-bottom:4px dashed var(--blue);color:var(--blue);text-align:center;padding:0 6px}
input.ans{font:inherit;font-size:24px;width:100%;padding:14px;border:4px solid var(--ink);background:#fff;margin-top:12px;outline:none}
input.ans:focus{border-color:var(--blue)}
.err{color:var(--red);font-size:16px;margin-top:6px;min-height:20px}
.text{background:#fff8e1;border:3px dashed #c9a75b;padding:12px 14px;font-weight:600;font-size:18px;line-height:1.6;margin-bottom:12px;max-height:260px;overflow:auto}
.text p{margin:0 0 6px}
.text .poem{font-style:italic;font-weight:800;color:#5a3b8a}
.text mark{background:var(--gold);padding:1px 3px;font-weight:800}
.fb{border:4px solid var(--ink);padding:14px;margin-top:14px;font-size:19px;line-height:1.45}
.fb.good{background:#dff5d3}.fb.bad{background:#ffe2dc}
.fb .big{font-size:26px;font-weight:900}
.fb .src{margin-top:10px;background:#fff8e1;padding:8px 10px;border-left:6px solid var(--gold);font-weight:700;font-size:17px}
.prog{display:flex;gap:5px;margin:4px 0 12px}
.prog i{flex:1;height:14px;border:2px solid var(--ink);background:#ddd}
.prog i.d{background:var(--grass)}.prog i.x{background:var(--red)}.prog i.c{background:var(--gold)}
.row{display:flex;gap:10px;flex-wrap:wrap;align-items:center}
.sp{flex:1}
.mapwrap{background:#cfe9fb;border:3px solid var(--ink);margin-top:12px;display:flex;justify-content:center}
.mapwrap svg{width:100%;max-width:560px;height:auto;display:block;touch-action:manipulation}
.reg{fill:#9bd27a;stroke:#fff;stroke-width:2.5;cursor:pointer}
.reg.de{fill:#d9e8d0;stroke:#fff;stroke-width:1.5}
.reg.de.by{fill:#9bd27a}
.reg.hl{fill:var(--gold)!important}.reg.ok{fill:var(--grass)!important}.reg.no{fill:var(--red)!important}
.reg.built{fill:url(#blocks)}.reg.unbuilt{fill:#c9c9c9;cursor:default}
.river{fill:none;stroke:#2a6fd6;stroke-width:4;stroke-linecap:round;stroke-linejoin:round}
.river.hl{stroke:var(--gold);stroke-width:8}.river.ok{stroke:var(--grass);stroke-width:8}.river.no{stroke:var(--red);stroke-width:8}
.hit{fill:none;stroke:transparent;stroke-width:26;cursor:pointer;stroke-linecap:round}
.mk{cursor:pointer}
.mk .b{stroke:var(--ink);stroke-width:2.5}
.mk.hl .b{fill:var(--gold)!important}.mk.ok .b{fill:var(--grass)!important}.mk.no .b{fill:var(--red)!important}
.num{font-family:'Press Start 2P';font-size:14px;fill:var(--ink);pointer-events:none}
.numbg{fill:#fff;stroke:var(--ink);stroke-width:2.5;pointer-events:none}
.match{display:grid;grid-template-columns:1fr 1fr;gap:10px;margin-top:12px}
.match .col{display:flex;flex-direction:column;gap:10px}
.match .btn{font-size:17px;min-height:54px}
.mascot{width:72px;height:72px;flex:none;image-rendering:pixelated}
.speech{background:#fff;border:3px solid var(--ink);padding:10px 12px;font-size:17px;position:relative;line-height:1.4}
.combo{position:fixed;top:18px;left:50%;transform:translateX(-50%);background:var(--gold);border:4px solid var(--ink);padding:10px 16px;font-size:14px;z-index:20;animation:pop 1.3s forwards;pointer-events:none}
@keyframes pop{0%{transform:translate(-50%,-20px) scale(.6);opacity:0}15%{transform:translate(-50%,0) scale(1.1);opacity:1}80%{opacity:1}100%{opacity:0;transform:translate(-50%,-10px)}}
@keyframes shake{0%,100%{transform:translateX(0)}25%{transform:translateX(-6px)}75%{transform:translateX(6px)}}
.shake{animation:shake .3s 2}
.overlay{position:fixed;inset:0;background:rgba(0,0,0,.55);display:flex;align-items:center;justify-content:center;z-index:30;padding:14px}
.overlay .card{max-width:640px;width:100%;max-height:92vh;overflow:auto}
table.t{width:100%;border-collapse:collapse;font-size:16px}
table.t td,table.t th{border-bottom:2px solid #e3dccb;padding:6px 4px;text-align:left}
textarea{width:100%;font-family:monospace;font-size:13px;min-height:90px;border:3px solid var(--ink);padding:8px}
.lvl{display:grid;grid-template-columns:repeat(auto-fit,minmax(230px,1fr));gap:12px;margin-top:10px}
.lvl .btn{text-align:left;font-size:18px;line-height:1.3}
.lvl small{display:block;font-size:15px;font-weight:700;opacity:.92;margin-top:4px}
.hint{font-size:16px;color:#5b5b5b;font-weight:700}
.palette{display:flex;gap:8px;flex-wrap:wrap;margin-top:10px}
.palette button{width:54px;height:54px;border:4px solid var(--ink);cursor:pointer}
.palette button.sel{outline:5px solid var(--gold);outline-offset:2px}
.bar{height:22px;border:3px solid var(--ink);background:#ddd;position:relative}
.bar i{position:absolute;left:0;top:0;bottom:0;background:repeating-linear-gradient(45deg,var(--blue) 0 10px,#fff 10px 20px)}
@media(max-width:480px){.top h1{font-size:12px}body{font-size:17px}.q{font-size:21px}}
.chip{display:inline-block;background:#e9f4ff;border:2px solid var(--ink);padding:2px 8px;margin:2px;font-size:14px}
</style>
</head>

<div id="app"></div>

 const x=norm(input);if(!x)return false;
 return answers.some(a=>{
  if(/\d/.test(a)){const dx=input.replace(/\D/g,''),da=a.replace(/\D/g,'');return dx===da}
  const y=norm(a);if(x===y)return true;
  const tol=y.length<=4?0:y.length<=7?1:2;
  return lev(x,y)<=tol;
 });
}
const today=()=>new Date().toISOString().slice(0,10);
function stars(st){const n=st.Q.length;let r=0;for(let l=1;l<=3;l++){const c=st.Q.filter(q=>(S.qs[q.id]||{}).best>=l).length;if(c>=Math.ceil(n*0.7))r=l}return r}

let AC=null;
function beep(type){if(!S.sound)return;try{AC=AC||new (window.AudioContext||window.webkitAudioContext)();
 const seq=type==='ok'?[[660,.08],[880,.12]]:type==='win'?[[523,.1],[659,.1],[784,.1],[1046,.25]]:type==='combo'?[[784,.07],[988,.07],[1175,.15]]:[[220,.18],[180,.22]];
 let t=AC.currentTime;seq.forEach(([f,d])=>{const o=AC.createOscillator(),g=AC.createGain();o.type='square';o.frequency.value=f;g.gain.setValueAtTime(.08,t);g.gain.exponentialRampToValueAtTime(.001,t+d);o.connect(g);g.connect(AC.destination);o.start(t);o.stop(t+d);t+=d})}catch(e){}}

function mascot(mood){const P={K:'#23272e',W:'#ffffff',B:'#1f6fd1',L:'#5aa0f0',E:'#ffffff',P:'#23272e',M:'#9c2a1f',G:'#f4c430'};
 const g=['KKKKKKKKKK','KBWBWBWBWK','KWBWBWBWBK','KBEEBWEEWK','KWEPWBEPBK','KBWBWBWBWK','KWBMMMMBBK','KBWBMMBWWK','KWBWBWBWBK','KKKKKKKKKK'];
 if(mood==='sad'){g[6]='KWBWBWBWBK';g[7]='KBWMMMMWWK'}
 let r='';g.forEach((row,y)=>[...row].forEach((c,x)=>{r+=`<rect x="${x}" y="${y}" width="1.02" height="1.02" fill="${P[c]}"/>`}));
 return `<svg class="mascot" viewBox="0 0 10 10" shape-rendering="crispEdges">${r}</svg>`}

// ================== Karten ==================
function mapSVG(kind,o={}){
 const isDE=kind==='de';
 const W=isDE?GEO.deW:GEO.byW,H=isDE?GEO.deH:GEO.byH;
 let s=`<svg viewBox="-6 -6 ${W+12} ${H+12}" xmlns="http://www.w3.org/2000/svg"><defs><pattern id="blocks" width="12" height="12" patternUnits="userSpaceOnUse"><rect width="12" height="12" fill="#5cb53a"/><rect width="6" height="6" fill="#6cc449"/><rect x="6" y="6" width="6" height="6" fill="#4ea32f"/></pattern></defs>`;
 if(isDE){
  for(const [n,d] of Object.entries(GEO.de)){
   s+=`<path class="reg de ${n==='Bayern'?'by':''} ${o.cls&&o.cls[n]||''}" data-id="${esc(n)}" d="${d}"/>`}
  if(o.num) for(const [k,n] of Object.entries(o.num)){const c=deCenter(n);s+=numLabel(c[0],c[1],k)}
 }else{
  for(const [n,d] of Object.entries(GEO.by)){
   const c=o.cls&&o.cls[n]||'';s+=`<path class="reg ${c}" ${o.regClick===false?'style="cursor:default"':`data-id="${n}"`} d="${d}"/>`}
  if(o.num) for(const [k,n] of Object.entries(o.num)){const p=GEO.pts['L_'+n];s+=numLabel(p[0],p[1],k)}
  if(o.labels) for(const n of BZN){const p=GEO.pts['L_'+n];s+=`<text x="${p[0]}" y="${p[1]}" text-anchor="middle" style="font:900 13px Nunito;fill:#23272e;paint-order:stroke;stroke:#fff;stroke-width:3px;pointer-events:none">${n}</text>`}
  if(o.rivers){for(const [n,d] of Object.entries(GEO.rivers)){s+=`<path class="river ${o.rcls&&o.rcls[n]||''}" d="${d}"/>`;
    if(o.riverClick)s+=`<path class="hit" data-id="${n}" d="${d}"/>`}
   if(o.riverNum){const d=GEO.rivers[o.riverNum.r].split('L');const mid=d[Math.floor(d.length/2)].replace('M','').split(',');s+=numLabel(+mid[0]+16,+mid[1]-16,o.riverNum.n)}}
  if(o.cities)for(const c of o.cities){const p=GEO.pts[c];const k=o.mcls&&o.mcls[c]||'';
   s+=`<g class="mk ${k}" data-id="${c}"><rect x="${p[0]-14}" y="${p[1]-14}" width="28" height="28" fill="transparent"/><rect class="b" x="${p[0]-7}" y="${p[1]-7}" width="14" height="14" fill="#23272e"/></g>`}
  if(o.areas)for(const a of o.areas){const p=GEO.pts[a];const k=o.mcls&&o.mcls[a]||'';
   s+=`<g class="mk ${k}" data-id="${a}"><rect x="${p[0]-24}" y="${p[1]-20}" width="48" height="40" fill="transparent"/><path class="b" fill="#8b5a2b" d="M${p[0]-17},${p[1]+11}L${p[0]-6},${p[1]-9}L${p[0]+1},${p[1]+2}L${p[0]+7},${p[1]-13}L${p[0]+19},${p[1]+11}Z"/></g>`}
  if(o.lakes)for(const a of o.lakes){const p=GEO.pts[a];const k=o.mcls&&o.mcls[a]||'';const rx=a==='Starnberger See'?6:a==='Bodensee'?16:12,ry=a==='Starnberger See'?14:a==='Bodensee'?9:9;
   s+=`<g class="mk ${k}" data-id="${a}"><rect x="${p[0]-22}" y="${p[1]-20}" width="44" height="40" fill="transparent"/><ellipse class="b" cx="${p[0]}" cy="${p[1]}" rx="${rx}" ry="${ry}" fill="#37a0ff"/></g>`}
  if(o.crown){s+=crownSVG(W/2-60,H/2-50,120)}
 }
 return s+'</svg>'}
function numLabel(x,y,k){return `<rect class="numbg" x="${x-15}" y="${y-15}" width="30" height="30"/><text class="num" x="${x}" y="${y+7}" text-anchor="middle">${k}</text>`}
const deCache={};
function deCenter(n){if(deCache[n])return deCache[n];const nums=GEO.de[n].match(/-?\d+\.?\d*/g).map(Number);let sx=0,sy=0,c=0,minx=1e9,maxx=-1e9,miny=1e9,maxy=-1e9;
 for(let i=0;i<nums.length;i+=2){minx=Math.min(minx,nums[i]);maxx=Math.max(maxx,nums[i]);miny=Math.min(miny,nums[i+1]);maxy=Math.max(maxy,nums[i+1])}
 return deCache[n]=[(minx+maxx)/2,(miny+maxy)/2]}
function crownSVG(x,y,w){const u=w/12;let r='';const px=(a,b,c,d,f)=>r+=`<rect x="${x+a*u}" y="${y+b*u}" width="${c*u}" height="${d*u}" fill="${f}"/>`;
 px(0,4,12,4,'#f4c430');px(0,2,2,2,'#f4c430');px(5,1,2,3,'#f4c430');px(10,2,2,2,'#f4c430');px(0,7,12,1,'#b88c0c');
 px(2,5,2,2,'#e04b3c');px(5,5,2,2,'#1f6fd1');px(8,5,2,2,'#e04b3c');px(5.5,0,1,1,'#fff');return `<g>${r}</g>`}

let R=null;

 const st=stationObj(id);let pool=st.Q.slice();
 const score=q=>{const s=S.qs[q.id]||{};return (s.box?6:0)+((s.best||0)<lvl?3:0)+(q.p===1?1.5:0)+Math.random()*2.5};
 pool=pool.map(q=>[score(q),q]).sort((a,b)=>b[0]-a[0]).map(x=>x[1]).slice(0,8);

 let h=header("if(confirm2())go({v:'home'})")+`<div class="card"><div class="row"><span class="hint">${q.st.icon} ${q.st.name} · ${LEVELS[lvl].e} ${LEVELS[lvl].n}</span><span class="sp"></span><span class="hint">Frage ${R.i+1} von ${R.qs.length}</span></div>
 <div class="prog">${R.qs.map((_,i)=>`<i class="${i<R.res.length?(R.res[i]?'d':'x'):i===R.i?'c':''}"></i>`).join('')}</div>`;

function gapText(g){return esc(g).replace('___','<span class="gap">?</span>')}
function qHTML(q,lvl){

 case'multi':return `<div class="q">${esc(q.q)}</div><div class="opts">${shuffle([...q.a,...q.d]).map(o=>`<button class="btn ghost" data-m="${esc(o)}">${esc(o)}</button>`).join('')}</div><button class="btn green" id="chk" style="width:100%;margin-top:12px">Prüfen ✔</button><div class="err" id="err"></div>`;
 case'match':{const pairs=uniquePairs(q.pairs);R.cur.pairs=pairs;R.cur.err=0;R.cur.done=0;
  return `<div class="q">${esc(q.q)}</div><div class="hint">Tippe links, dann rechts.</div><div class="match"><div class="col">${shuffle(pairs).map(p=>`<button class="btn ghost" data-l="${esc(p[0])}">${esc(p[0])}</button>`).join('')}</div><div class="col">${shuffle(pairs).map(p=>`<button class="btn ghost" data-r="${esc(p[1])}">${esc(p[1])}</button>`).join('')}</div></div>`}
 case'tap':return `<div class="q">${esc(q.q)}</div><div class="mapwrap" id="map">${tapMap(q,{})}</div>`;

 }}
function inputHTML(lvl,q){return `<input class="ans" id="inp" autocomplete="off" autocapitalize="off" spellcheck="false" placeholder="Antwort hier eintippen…">

const MAPKIND={de:'de',by:'by',river:'by',city:'by',area:'by',lake:'by'};

 return o}

 if(q.num&&(q.map==='by'||q.map==='de'))o.num=q.num;
 if(q.map==='river'&&q.num)o.riverNum={r:q.hl,n:q.num};

function wireQ(q,lvl){

  let ok;if(q.t==='tf')ok=(b.dataset.o==='1')===q.a;else if(q.t==='mc')ok=b.dataset.o===q.a;else ok=b.dataset.o===q.a[0];

  if(!ok)b.classList.add('no');answer(ok,b.dataset.o)});
 const chk=$('#chk'),inp=$('#inp');
 if(inp){const submit=()=>{if(R.answered)return;const v=inp.value.trim();if(!v){$('#err').textContent='Schreib zuerst eine Antwort hinein 🙂';return}
   const ok=matches(v,q.a);inp.disabled=true;inp.style.borderColor=ok?'var(--grass)':'var(--red)';if(!ok)inp.classList.add('shake');answer(ok,v)};
  chk.onclick=submit;inp.onkeydown=e=>{if(e.key==='Enter')submit()};inp.oninput=()=>$('#err').textContent='';
  const tip=$('#tip');if(tip)tip.onclick=()=>{R.cur.tip=(R.cur.tip||0)+1;const a=q.a[0];$('#err').innerHTML=`<span style="color:var(--blue)">💡 Das Wort beginnt mit <b>${esc(a.slice(0,R.cur.tip))}</b>… (${a.length} Zeichen)</span>`;
   if(q.st.text&&q.s!==undefined){$('#txt').innerHTML=textHTML(q.st,q.s);const d=$('#txt').closest('details');if(d)d.open=true;const m=$('#txt mark');if(m)m.scrollIntoView({block:'nearest'})}};
  $('#idk').onclick=()=>{if(R.answered)return;inp.disabled=true;answer(false,'')}}
 if(q.t==='multi'){app.querySelectorAll('[data-m]').forEach(b=>b.onclick=()=>{if(R.answered)return;b.classList.toggle('sel');$('#err').textContent=''});
  chk.onclick=()=>{if(R.answered)return;const sel=[...app.querySelectorAll('[data-m].sel')].map(b=>b.dataset.m);if(!sel.length){$('#err').textContent='Tippe mindestens eine Antwort an.';return}
   app.querySelectorAll('[data-m]').forEach(b=>{b.disabled=true;const right=q.a.includes(b.dataset.m);if(right)b.classList.add('ok');else if(b.classList.contains('sel'))b.classList.add('no')});
   const ok=sel.length===q.a.length&&sel.every(x=>q.a.includes(x));answer(ok,sel.join(', '))}}
 if(q.t==='match'){let L=null;const pm=Object.fromEntries(R.cur.pairs);
  app.querySelectorAll('[data-l]').forEach(b=>b.onclick=()=>{if(b.disabled)return;app.querySelectorAll('[data-l]').forEach(x=>x.classList.remove('sel'));b.classList.add('sel');L=b});
  app.querySelectorAll('[data-r]').forEach(b=>b.onclick=()=>{if(!L||b.disabled)return;
   if(pm[L.dataset.l]===b.dataset.r){[L,b].forEach(x=>{x.classList.remove('sel');x.classList.add('ok');x.disabled=true});L=null;R.cur.done++;beep('ok');
    if(R.cur.done===R.cur.pairs.length)answer(R.cur.err===0,'')}
   else{R.cur.err++;b.classList.add('no','shake');beep('bad');setTimeout(()=>b.classList.remove('no','shake'),600)}})}
 if(q.t==='tap'){const wire=()=>$('#map').querySelectorAll('[data-id]').forEach(el=>el.addEventListener('click',()=>{if(R.answered)return;
   const id=el.dataset.id,ok=id===q.target,cls={[q.target]:'ok'};if(!ok)cls[id]='no';$('#map').innerHTML=tapMap(q,{cls});answer(ok,id)}));wire()}
 if(q.t==='paint')wirePaint();
}

function answer(ok,given){
 R.answered=true;const q=R.qs[R.i],s=qState(q.id),lvl=R.lvl;
 S.days[today()]=(S.days[today()]||0)+1;
 if(ok){s.ok++;s.best=Math.max(s.best,lvl);s.box=false;R.combo++;let g=lvl===3?2:1;
  if(R.combo>0&&R.combo%3===0){g+=2;comboToast(R.combo)}else beep('ok');R.gain+=g;S.rauten+=g}
 else{s.bad++;s.box=true;R.combo=0;beep('bad')}
 R.res.push(ok);save();
 const praise=['Super!','Stark!','Volltreffer!','Klasse!','Spitze!','Genau!'][Math.floor(Math.random()*6)];
 let right='';
 if(q.t==='gap'||q.t==='name')right=`Richtig ist: <b>${esc(q.a[0])}</b>`;
 if(q.t==='mc')right=`Richtig ist: <b>${esc(q.a)}</b>`;
 if(q.t==='multi')right=`Richtig sind: <b>${q.a.map(esc).join(', ')}</b>`;
 if(q.t==='tap')right=`Die richtige Stelle leuchtet grün.`;
 if(q.t==='match')right=ok?'':'Ein paar Paare hast du erst im zweiten Versuch gefunden.';
 if(q.t==='paint')right='';
 let why=q.t==='tf'&&q.why?esc(q.why):'';
 if(q.t==='gap'&&ok&&!matchesExact(given,q.a))why=`Gemeint ist: <b>${esc(q.a[0])}</b> – die Schreibweise zählt hier nicht.`;
 const src=q.st.text&&q.s!==undefined?`<div class="src">📖 ${esc(q.st.text[q.s])}</div>`:'';
 $('#fb').innerHTML=`<div class="fb ${ok?'good':'bad'}"><div class="big">${ok?'✅ '+praise:'❌ Fast! Merk dir:'}</div>${ok?(why?'<div>'+why+'</div>':''):`<div>${right}</div>${why?'<div>'+why+'</div>':''}`}${src}
 <button class="btn ${ok?'green':'blue'}" id="next" style="width:100%;margin-top:12px">${R.i+1<R.qs.length?'Weiter ▶':'Fertig! ▶'}</button></div>`;
 if(R.lvl<3&&q.st.text&&q.s!==undefined&&$('#txt')){$('#txt').innerHTML=textHTML(q.st,q.s)}
 $('#next').onclick=()=>{R.i++;if(R.i<R.qs.length)go({v:'play'});else go({v:'end'})};
 setTimeout(()=>$('#next')&&$('#next').scrollIntoView({behavior:'smooth',block:'nearest'}),60)}
function matchesExact(v,a){return a.some(x=>norm(x)===norm(v))}
function toast(t){const d=document.createElement('div');d.className='combo px';d.textContent=t;document.body.appendChild(d);setTimeout(()=>d.remove(),1400)}
function comboToast(n){beep('combo');toast(`🔥 ${n}er-Combo! +2`)}

function End(){
 const ok=R.res.filter(Boolean).length,n=R.res.length;
 const st=R.st.id==='kiste'?null:R.st;const st3=st?stars(st):0;
 if(ok===n)beep('win');
 const msg=ok===n?'Perfekt! Alle richtig! 🏆':ok>=n*.7?'Richtig gut gemacht! 💪':ok>=n*.4?'Gut! Mit jeder Runde wirst du besser. 🙂':'Weiter üben – die Nochmal-Kiste hilft dir! 📦';
 app.innerHTML=header()+`<div class="card" style="text-align:center"><div style="display:flex;justify-content:center">${mascot(ok<n*.4?'sad':'')}</div>
 <h2 class="px" style="font-size:16px;line-height:1.6">${ok} von ${n} richtig</h2><p style="font-size:22px">${msg}</p>
 <p class="pill" style="display:inline-flex;font-size:20px"><span class="raute"></span> +${R.gain} Rauten-Blöcke</p>
 ${st?`<div class="stars" style="font-size:30px">${starHTML(st3)}</div><div class="hint">${st3<3?`Nächster Stern: 70 % der Fragen dieser Station auf Stufe ${LEVELS[st3+1].e} ${LEVELS[st3+1].n} richtig`:'Alle Sterne geholt!'}</div>`:''}
 <div class="lvl" style="margin-top:16px"><button class="btn green" onclick="startRound('${R.st.id}',${R.lvl})">🔁 Noch eine Runde</button>
 ${R.lvl<3&&R.st.id!=='kiste'?`<button class="btn gold" onclick="startRound('${R.st.id}',${R.lvl+1})">⬆ Stufe ${LEVELS[R.lvl+1].e} ${LEVELS[R.lvl+1].n}</button>`:''}
 <button class="btn ghost" onclick="go({v:'home'})">🏠 Zur Karte</button></div><div class="ground"></div></div>`}

// ================== Wappen malen ==================
const PCOL={weiß:'#ffffff',blau:'#1f6fd1',gold:'#f4c430',rot:'#e04b3c',schwarz:'#23272e',grün:'#5cb53a'};
function paintHTML(){R.cur.paint={};R.cur.color='blau';
 const cells=[];const w=40,h=56;let id=0;
 for(let j=-2;j<8;j++)for(let i=-2;i<8;i++){for(const sub of [0,1]){const cx=i*w+(sub?w/2:0),cy=j*h+(sub?h/2:0);
  cells.push(`<polygon class="pc" data-c="${id}" data-p="${sub}" points="${cx},${cy-h/2} ${cx+w/2},${cy} ${cx},${cy+h/2} ${cx-w/2},${cy}" fill="#f2f2f2" stroke="#23272e" stroke-width="1.5"/>`);id++}}
 R.cur.ncells=id;
 const shield='M20,70 H220 V190 Q220,280 120,290 Q20,280 20,190 Z';
 return `<div class="palette">${Object.entries(PCOL).map(([n,c])=>`<button data-col="${n}" aria-label="${n}" class="${n==='blau'?'sel':''}" style="background:${c}"></button>`).join('')}</div>
 <div class="hint" style="margin-top:6px">Farbe wählen, dann Felder antippen. Vergiss die Krone nicht!</div>
 <div class="mapwrap" style="background:#fff"><svg viewBox="0 0 240 300" style="max-width:380px"><defs><clipPath id="sh"><path d="${shield}"/></clipPath></defs>
 <g clip-path="url(#sh)"><g transform="translate(120,180) rotate(-22) translate(-150,-170)">${cells.join('')}</g></g>
 <path d="${shield}" fill="none" stroke="#23272e" stroke-width="5"/>
 <path class="pcr" data-crown="1" d="M30,62 L30,22 L60,42 L90,10 L120,38 L150,10 L180,42 L210,22 L210,62 Z" fill="#f2f2f2" stroke="#23272e" stroke-width="4"/>
 </svg></div><button class="btn green" id="chk" style="width:100%;margin-top:12px">Fertig gemalt ✔</button><div class="err" id="err"></div>`}
function wirePaint(){
 app.querySelectorAll('[data-col]').forEach(b=>b.onclick=()=>{app.querySelectorAll('[data-col]').forEach(x=>x.classList.remove('sel'));b.classList.add('sel');R.cur.color=b.dataset.col});
 const paint=el=>{if(R.answered)return;el.setAttribute('fill',PCOL[R.cur.color]);el.dataset.col=R.cur.color;$('#err').textContent=''};
 app.querySelectorAll('.pc,.pcr').forEach(el=>el.addEventListener('click',()=>paint(el)));
 $('#chk').onclick=()=>{if(R.answered)return;
  const vis=[...app.querySelectorAll('.pc')].filter(isVisibleCell);
  if(vis.some(c=>!c.dataset.col)){$('#err').textContent='Da sind noch weiße Lücken – mal alle Felder aus! (Weiß musst du auch auswählen.)';return}
  const cr=app.querySelector('.pcr').dataset.col;
  const c0=new Set(vis.filter(c=>c.dataset.p==='0').map(c=>c.dataset.col)),c1=new Set(vis.filter(c=>c.dataset.p==='1').map(c=>c.dataset.col));
  const a=[...c0][0],b=[...c1][0];
  const ok=c0.size===1&&c1.size===1&&((a==='weiß'&&b==='blau')||(a==='blau'&&b==='weiß'))&&cr==='gold';
  if(!ok)$('#err').textContent='';
  answerPaint(ok)}}
function isVisibleCell(el){const r=el.getBoundingClientRect(),s=el.ownerSVGElement.getBoundingClientRect();
 const k=s.width/240;const cx=(r.left+r.right)/2-s.left,cy=(r.top+r.bottom)/2-s.top;const x=cx/k,y=cy/k;
 if(x<26||x>214||y<76)return false;if(y<=190)return true;const dx=(x-120)/100;return y<190+95*(1-dx*dx)-8}
function answerPaint(ok){answer(ok,'');if(!ok){$('#fb .fb div:nth-child(2)').innerHTML='Die Rauten sind abwechselnd <b>weiß und blau</b>, die Volkskrone ist <b>golden</b>.'}}

// ================== Eltern ==================
function parentGate(){const a=6+Math.floor(Math.random()*4),b=6+Math.floor(Math.random()*4);
 overlay(`<h2 class="px" style="font-size:14px">Für Eltern</h2><p>Bitte lösen: <b>${a} × ${b} = ?</b></p><input class="ans" id="pg" inputmode="numeric"><div class="err" id="err"></div>
 <div class="row"><button class="btn green" id="pgok">Öffnen</button><button class="btn ghost" onclick="closeOv()">Abbrechen</button></div>`);
 const f=()=>{if(+$('#pg').value===a*b)Parents();else $('#err').textContent='Leider falsch.'};$('#pgok').onclick=f;$('#pg').onkeydown=e=>{if(e.key==='Enter')f()};setTimeout(()=>$('#pg').focus(),50)}
function overlay(h){closeOv();const d=document.createElement('div');d.className='overlay';d.id='ov';d.innerHTML=`<div class="card">${h}</div>`;document.body.appendChild(d)}
function closeOv(){const o=$('#ov');if(o)o.remove()}
function Parents(){
 const days=Object.keys(S.days).sort();const tot=Object.values(S.qs).reduce((a,s)=>a+s.ok+s.bad,0),ok=Object.values(S.qs).reduce((a,s)=>a+s.ok,0);
 const rows=STATIONS.map(st=>{const tried=st.Q.filter(q=>S.qs[q.id]&&(S.qs[q.id].ok+S.qs[q.id].bad)).length;
  const lv=[1,2,3].map(l=>Math.round(100*st.Q.filter(q=>(S.qs[q.id]||{}).best>=l).length/st.Q.length));
  return `<tr><td>${st.icon} ${st.name}</td><td>${tried}/${st.Q.length}</td><td>${lv.join(' / ')} %</td><td>${starHTML(stars(st))}</td></tr>`}).join('');
 const box=boxQs().map(id=>{const q=ALLQ[id];return `<span class="chip">${esc((q.g||q.q||'').replace('___','…').slice(0,60))}</span>`}).join('')||'<span class="hint">leer</span>';
 overlay(`<div class="row"><h2 class="px" style="font-size:14px;margin:0">Eltern-Ansicht</h2><span class="sp"></span><button class="btn small ghost" onclick="closeOv()">✕</button></div>
 <p><b>Spieltage:</b> ${days.length} ${days.length?`<span class="hint">(zuletzt ${days[days.length-1].split('-').reverse().join('.')})</span>`:''}<br>
 <b>Antworten gesamt:</b> ${tot} · davon richtig: ${tot?Math.round(100*ok/tot):0} %<br><b>Rauten:</b> ${S.rauten} · <b>Bezirke gebaut:</b> ${builtCount()}/7 ${S.crown?'· 👑 Krone!':''}</p>
 <table class="t"><tr><th>Station</th><th>geübt</th><th>sicher auf Holz / Eisen / Diamant</th><th></th></tr>${rows}</table>
 <p class="hint">„Sicher“ = mindestens einmal auf dieser Stufe richtig. Ein Stern gibt es ab 70 %.</p>
 <h3>📦 Nochmal-Kiste (${boxQs().length})</h3><div>${box}</div>
 <h3>Sicherung</h3><p class="hint">Den Spielstand kopieren und z. B. als Notiz speichern. So lässt er sich wiederherstellen.</p>
 <textarea id="bk">${btoa(unescape(encodeURIComponent(JSON.stringify(S))))}</textarea>
 <div class="row"><button class="btn small blue" id="cp">📋 Kopieren</button><button class="btn small ghost" id="rs">⤴ Spielstand einfügen & laden</button><button class="btn small red" id="rst">🗑 Alles zurücksetzen</button></div><div class="err" id="err"></div>`);
 $('#cp').onclick=()=>{const t=$('#bk');t.select();try{navigator.clipboard.writeText(t.value).then(()=>$('#err').innerHTML='<span style="color:green">Kopiert!</span>',()=>$('#err').textContent='Bitte manuell markieren und kopieren.')}catch(e){$('#err').textContent='Bitte manuell markieren und kopieren.'}};
 $('#rs').onclick=()=>{try{const o=JSON.parse(decodeURIComponent(escape(atob($('#bk').value.trim()))));if(!o||typeof o.rauten!=='number')throw 0;S=Object.assign(fresh(),o);save();closeOv();render()}catch(e){$('#err').textContent='Der Code ist ungültig.'}};
 let armed=false;$('#rst').onclick=()=>{if(!armed){armed=true;$('#rst').textContent='Wirklich? Nochmal tippen';return}S=fresh();S.seenIntro=true;save();closeOv();go({v:'home'})}}

render();
</script>
</body>
</html>
